<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>One World One Centre Student Intake Form</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.3/html2pdf.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

  <link href="https://cdn.jsdelivr.net/npm/tom-select/dist/css/tom-select.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/tom-select/dist/js/tom-select.complete.min.js"></script>

  <style>
    /* GLOBAL BOX SIZING */
    *, *::before, *::after { box-sizing: border-box; }

    body { 
        margin: 0; 
        min-height: 100vh; 
        background-color: #f3f4f6;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    
    /* WIZARD CONTAINER - FIXED HEIGHT STRATEGY */
    .wizard-wrapper {
        background-color: white;
        border: 3px solid #C7631C; 
        border-radius: 0.5rem;
        margin: 1rem auto;
        max-width: 1100px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        display: flex;
        flex-direction: column;
        /* Fixed height for the whole card (adjust 85vh to preference) */
        height: 85vh; 
        min-height: 600px;
    }

    /* HEADER (Fixed at top) */
    .wizard-header {
        flex-shrink: 0;
        padding: 1rem 1.5rem;
        border-bottom: 2px solid #e5e7eb;
    }

    /* CONTENT AREA (Scrollable) */
    .wizard-content {
        flex-grow: 1;
        overflow-y: auto; /* Internal scroll */
        padding: 1.5rem;
        position: relative;
    }

    /* FOOTER (Fixed at bottom) */
    .wizard-footer {
        flex-shrink: 0;
        padding: 1rem 1.5rem;
        border-top: 2px solid #e5e7eb;
        background-color: #f9fafb;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    /* INPUT STYLES */
    select { transform-origin: top center !important; }
    .disabled-input { background:#f3f4f6; color:#6b7280; pointer-events: none; }
    
    /* HIDE SCROLLBAR visually but allow scroll */
    .wizard-content::-webkit-scrollbar { width: 8px; }
    .wizard-content::-webkit-scrollbar-track { background: #f1f1f1; }
    .wizard-content::-webkit-scrollbar-thumb { background: #888; border-radius: 4px; }
    .wizard-content::-webkit-scrollbar-thumb:hover { background: #555; }

    /* YELLOW TABLE STYLING */
    table.yellow-table { width: 100%; border-collapse: collapse; border: 2px solid black; font-size: 0.8rem; table-layout: fixed; min-width: 700px; }
    table.yellow-table td, table.yellow-table th { border: 1px solid black; padding: 4px 6px; vertical-align: top; word-wrap: break-word; overflow-wrap: anywhere; }
    
    /* Nested Tables */
    table.nested-table { width: 100%; border-collapse: collapse; margin: -1px; width: calc(100% + 2px); table-layout: fixed; }
    table.nested-table td { border: 1px solid black !important; border-top: none !important; border-bottom: none !important; }
    
    /* Student Row Specifics */
    tr.student-row td { border-bottom: 1px solid black !important; }
    tr.student-row:last-child td { border-bottom: none !important; }
    table.nested-table td:first-child { border-left: none !important; }
    table.nested-table td:last-child { border-right: none !important; }
    td.no-padding { padding: 0 !important; height: 100%; }

    /* Text Formatting */
    .font-semibold { font-weight: 700; margin-bottom: 2px; font-size: 0.75rem; text-transform: uppercase; }
    .cell-content { width: 100%; min-height: 18px; word-break: break-word; overflow-wrap: anywhere; }

    /* PDF Print Specifics */
    #finalArea.pdf-scale { width: 100%; font-size: 10px !important; }
    
    /* Library Tweaks */
    .select2-container .select2-selection--single { height: 42px; border: 1px solid #d1d5db; padding: 6px; }
    .select2-container--default .select2-selection--single .select2-selection__arrow { height: 42px; top: 0; }
    
    /* Mobile Scroll for Table */
    .table-responsive { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    
    /* Helper Utilities */
    .hidden { display: none !important; }
    .invisible { visibility: hidden; }
  </style>
</head>

<body class="bg-gray-100 text-gray-800">

  <div id="wizardRoot" class="wizard-wrapper">
    
    <div class="wizard-header flex flex-col md:flex-row items-center justify-between gap-4">
        <h1 class="text-lg md:text-xl font-bold leading-tight text-center md:text-left text-gray-700">
            ONE WORLD ONE CENTRE<br><span class="text-sm font-normal text-gray-500">Student Intake Form</span>
        </h1>
        <img src="One World Logo.jpg" alt="Logo" class="w-32 md:w-48 h-auto object-contain flex-shrink-0">
    </div>

    <div class="wizard-content">
        
        <section class="page" data-step="1">
            <h2 class="font-medium mb-4 text-lg border-b pb-2 text-orange-600">Step 1: Contact Information</h2>
            <div class="grid grid-cols-12 gap-4">
              <div class="col-span-12 md:col-span-2">
                <label class="block text-sm font-bold">DATE</label>
                <input id="date" type="date" class="w-full border rounded p-2 mt-1" />
              </div>
              <div class="col-span-12 md:col-span-3">
                <label class="block text-sm font-bold">TAKEN BY</label>
                <input id="takenBy" type="text" class="w-full border rounded p-2 mt-1" />
              </div>
              <div class="col-span-12 md:col-span-4">
                <label class="block text-sm font-bold">CONTACT NAME / SURNAME</label>
                <input id="contactName" type="text" class="w-full border rounded p-2 mt-1" />
              </div>
              <div class="col-span-12 md:col-span-3">
                <label class="block text-sm font-bold">CONTACT PHONE #</label>
                <input id="contactPhone" type="tel" maxlength="14" class="w-full border rounded p-2 mt-1" oninput="formatPhone(this)" />
              </div>
              
              <div class="col-span-12 md:col-span-6 mt-2">
                <label class="block text-sm font-bold mb-1">CONTACT RELATIONSHIP</label>
                <select id="contactRel" class="border rounded p-3 w-full" onchange="toggleOtherRelation(this)">
                  <option value="" disabled selected hidden>-- Select --</option>
                  <option value="Mother">Mother</option>
                  <option value="Father">Father</option>
                  <option value="Sister">Sister</option>
                  <option value="Brother">Brother</option>
                  <option value="Step-Mother">Step-Mother</option>
                  <option value="Step-Father">Step-Father</option>
                  <option value="Half-Sister">Half-Sister</option>
                  <option value="Half-Brother">Half-Brother</option>
                  <option value="Uncle">Uncle</option>
                  <option value="Aunt">Aunt</option>
                  <option value="Cousin">Cousin</option>
                  <option value="Grandmother">Grandmother</option>
                  <option value="Grandfather">Grandfather</option>
                  <option value="Guardian">Guardian</option>
                  <option value="Sponsor">Sponsor</option>
                  <option value="Family Friend">Family Friend</option>
                  <option value="Neighbor">Neighbor</option>
                  <option value="Community Worker">Community Worker</option>
                  <option value="Social Worker">Social Worker</option>
                  <option value="Other">Other</option>
                </select>
                <input type="text" id="otherRelation" class="border rounded p-2 w-full mt-2 hidden" placeholder="Specify" />
              </div>
            </div>
        </section>

        <section class="page hidden" data-step="2">
            <h2 class="font-medium mb-4 text-lg border-b pb-2 text-orange-600">Step 2: Status & History</h2>
            <div class="grid grid-cols-12 gap-4">
              <div class="col-span-12 md:col-span-6">
                <label class="block text-sm font-bold">STUDENT'S STATUS</label>
                <div class="mt-1 flex flex-wrap gap-3 p-3 bg-gray-50 rounded border">
                  <label class="flex items-center cursor-pointer"><input type="radio" name="studentStatus" value="PR" class="mr-2" onchange="toggleOtherField('studentStatusOther', this)"> PR</label>
                  <label class="flex items-center cursor-pointer"><input type="radio" name="studentStatus" value="RC" class="mr-2" onchange="toggleOtherField('studentStatusOther', this)"> RC</label>
                  <label class="flex items-center cursor-pointer"><input type="radio" name="studentStatus" value="WP" class="mr-2" onchange="toggleOtherField('studentStatusOther', this)"> WP</label>
                  <label class="flex items-center cursor-pointer"><input type="radio" name="studentStatus" value="Other" class="mr-2" onchange="toggleOtherField('studentStatusOther', this)"> Other</label>
                </div>
                <input id="studentStatusOther" type="text" class="hidden w-full border rounded p-2 mt-2" placeholder="Specify" />
              </div>
              
              <div class="col-span-12 md:col-span-6">
                <label class="block text-sm font-bold">IMMIGRATION DOC (PARENT)</label>
                <div class="mt-1 flex flex-wrap gap-3 p-3 bg-gray-50 rounded border">
                  <label class="flex items-center cursor-pointer"><input type="radio" name="immDoc" value="PR" class="mr-2" onchange="toggleOtherField('immDocOther', this)"> PR</label>
                  <label class="flex items-center cursor-pointer"><input type="radio" name="immDoc" value="RC" class="mr-2" onchange="toggleOtherField('immDocOther', this)"> RC</label>
                  <label class="flex items-center cursor-pointer"><input type="radio" name="immDoc" value="WP" class="mr-2" onchange="toggleOtherField('immDocOther', this)"> WP</label>
                  <label class="flex items-center cursor-pointer"><input type="radio" name="immDoc" value="Other" class="mr-2" onchange="toggleOtherField('immDocOther', this)"> Other</label>
                </div>
                <input id="immDocOther" type="text" class="hidden w-full border rounded p-2 mt-2" placeholder="Specify" />
              </div>
              
              <div class="col-span-12 md:col-span-6">
                <label class="block text-sm font-bold">EXPIRY DATE</label>
                <input id="expiry" type="date" class="w-full border rounded p-2 mt-1" />
              </div>
              
              <div class="col-span-12 md:col-span-6">
                <label class="block text-sm font-bold">DATE LANDED</label>
                <input id="landed" type="date" class="w-full border rounded p-2 mt-1" />
              </div>

              <div class="col-span-12 mt-4 border-t pt-4">
                <label class="block text-sm font-bold">PREVIOUS ATTENDANCE IN CANADIAN SCHOOLS?</label>
                <div class="mt-2 flex gap-6">
                  <label class="flex items-center cursor-pointer"><input type="radio" name="prevAttend" value="No" class="mr-2 transform scale-125" onchange="toggleAttendance(false)"> No</label>
                  <label class="flex items-center cursor-pointer"><input type="radio" name="prevAttend" value="Yes" class="mr-2 transform scale-125" onchange="toggleAttendance(true)"> Yes</label>
                </div>
                <input id="prevDetails" type="text" class="mt-2 w-full border rounded p-2 disabled-input" placeholder="Details (School Name, Grade)..." disabled />
              </div>
            </div>
        </section>

        <section class="page hidden" data-step="3">
            <h2 class="font-medium mb-4 text-lg border-b pb-2 text-orange-600">Step 3: Parent/Guardian Details</h2>
            <div class="grid grid-cols-12 gap-4">
              <div class="col-span-12 md:col-span-6">
                <label class="block text-sm font-bold">FATHER'S SURNAME</label>
                <input id="fatherSurname" type="text" class="w-full border rounded p-2 mt-1" />
              </div>
              <div class="col-span-12 md:col-span-6">
                <label class="block text-sm font-bold">FATHER'S GIVEN NAME</label>
                <input id="fatherGiven" type="text" class="w-full border rounded p-2 mt-1" />
              </div>
              <div class="col-span-12 border-b my-2 md:hidden"></div> 
              <div class="col-span-12 md:col-span-6">
                <label class="block text-sm font-bold">MOTHER'S SURNAME</label>
                <input id="motherSurname" type="text" class="w-full border rounded p-2 mt-1" />
              </div>
              <div class="col-span-12 md:col-span-6">
                <label class="block text-sm font-bold">MOTHER'S GIVEN NAME</label>
                <input id="motherGiven" type="text" class="w-full border rounded p-2 mt-1" />
              </div>
            </div>
        </section>

        <section class="page hidden" data-step="4">
            <h2 class="font-medium mb-4 text-lg border-b pb-2 text-orange-600">Step 4: Address & Language</h2>
            <div class="grid grid-cols-12 gap-4">
              <div class="col-span-4 md:col-span-2">
                <label class="block text-sm font-bold">APT #</label>
                <input id="apt" type="text" class="w-full border rounded p-2 mt-1" />
              </div>
              <div class="col-span-8 md:col-span-7">
                <label class="block text-sm font-bold">FAMILY ADDRESS</label>
                <input id="address" type="text" class="w-full border rounded p-2 mt-1" />
              </div>
              <div class="col-span-12 md:col-span-3">
                <label class="block text-sm font-bold">POSTAL CODE</label>
                <input id="postal" type="text" class="w-full border rounded p-2 mt-1" oninput="enforcePostalFormat(this)" />
              </div>
              
              <div class="col-span-12 md:col-span-4 mt-2">
                <label class="block text-sm font-bold">FAMILY PHONE #</label>
                <input id="familyPhone" type="tel" class="w-full border rounded p-2 mt-1" oninput="formatPhone(this)" />
              </div>
              
              <div class="col-span-12 md:col-span-8 mt-2">
                <label class="block text-sm font-bold">HOME LANGUAGE(S)</label>
                <select id="homeLang" multiple class="w-full border rounded p-2 mt-1"></select>
              </div>
              
              <div class="col-span-12 mt-4 p-4 bg-blue-50 rounded border border-blue-100">
                <label class="block text-sm font-bold">CATHOLIC RATEPAYER?</label>
                <div class="flex gap-6 mt-2">
                    <label class="flex items-center cursor-pointer"><input type="radio" name="catholic" value="No" class="mr-2"> No</label>
                    <label class="flex items-center cursor-pointer"><input type="radio" name="catholic" value="Yes" class="mr-2"> Yes</label>
                </div>
                <input id="religionOther" type="text" class="mt-2 w-full border rounded p-2 bg-white" placeholder="If not Catholic, specify..." />
              </div>
            </div>
        </section>

        <section class="page hidden" data-step="5">
            <h2 class="font-medium mb-4 text-lg border-b pb-2 text-orange-600">Step 5: Student Details</h2>
            <div id="studentsContainer" class="space-y-6"></div>
            
            <div class="flex flex-col md:flex-row items-center gap-3 mt-6 border-t pt-4">
              <button class="w-full md:w-auto px-4 py-2 bg-blue-600 text-white rounded shadow hover:bg-blue-700 transition" onclick="addStudent()" type="button">+ Add Another Student</button>
              <button class="w-full md:w-auto px-4 py-2 bg-red-100 text-red-700 border border-red-300 rounded hover:bg-red-200 transition" onclick="removeStudent()" type="button">Remove Last Student</button>
            </div>
        </section>

        <section class="page hidden" data-step="6">
            <h2 class="font-medium mb-4 text-lg border-b pb-2 text-orange-600">Step 6: Final Notes</h2>
            <div class="grid grid-cols-12 gap-4">
                <div class="col-span-12">
                    <label class="block text-sm font-bold">LIMITED FORMAL SCHOOLING?</label>
                    <div class="flex gap-6 mt-2 p-3 bg-gray-50 border rounded">
                        <label class="flex items-center cursor-pointer"><input type="radio" name="limitedProfile" value="No" onchange="toggleLimitedProfile(false)" class="mr-2"> No</label>
                        <label class="flex items-center cursor-pointer"><input type="radio" name="limitedProfile" value="Yes" onchange="toggleLimitedProfile(true)" class="mr-2"> Yes</label>
                    </div>
                </div>
            </div>
            <div id="limitedProfileBox" class="col-span-12 mt-4 hidden">
                <label class="block text-sm font-bold">Details:</label>
                <textarea id="limitedProfileDetails" rows="3" class="w-full border rounded p-2 mt-1"></textarea>
            </div>
            <div class="col-span-12 mt-4">
                <label class="block text-sm font-bold">NOTE:</label>
                <textarea id="notes" rows="4" class="w-full border rounded p-2 mt-1" placeholder="Siblings, special needs, appointment preferences..."></textarea>
            </div>
        </section>
    </div>

    <div class="wizard-footer">
        <button id="navBackBtn" type="button" class="w-32 px-4 py-2 bg-gray-500 text-white rounded shadow hover:bg-gray-600 transition invisible" onclick="handleBack()">
            &larr; Back
        </button>
        <button id="navNextBtn" type="button" class="w-48 px-4 py-2 bg-green-700 text-white rounded shadow hover:bg-green-800 transition font-bold" onclick="handleNext()">
            Next &rarr;
        </button>
    </div>

  </div> <div id="finalWrap" class="hidden max-w-5xl mx-auto mt-6 p-4">
      
      <div class="table-responsive bg-gray-200 p-2 rounded border mb-4">
        <div id="finalArea" class="p-6 rounded shadow border min-w-[700px] bg-white"></div>
      </div>

      <div class="mt-4 flex flex-col md:flex-row justify-center gap-3 relative">
        <div id="orientationSelector" class="absolute hidden bottom-full left-1/2 -translate-x-1/2 mb-3 p-3 rounded shadow-xl z-20 text-sm bg-[#fff8dc] border border-[#C7631C] w-56">
            <p class="font-bold mb-2 text-gray-800 text-center">Select PDF Orientation:</p>
            <button id="downloadPortraitBtn" class="w-full mb-1 px-3 py-2 text-white rounded hover:opacity-90 transition bg-[#C7631C]">Portrait (Taller)</button>
            <button id="downloadLandscapeBtn" class="w-full px-3 py-2 text-white rounded hover:opacity-90 transition bg-[#C7631C]">Landscape (Wider)</button>
        </div>
    
        <button id="editBtn" class="w-full md:w-auto px-4 py-3 bg-green-700 text-white rounded shadow">Back to Edit</button>
        <button id="printBtn" class="w-full md:w-auto px-4 py-3 bg-blue-600 text-white rounded shadow" onclick="window.print()">Print</button>
        <button id="pdfBtn" class="w-full md:w-auto px-4 py-3 text-white rounded shadow bg-[#C7631C]">Download PDF</button>
        <button id="newFormBtn" class="w-full md:w-auto px-4 py-3 bg-red-700 text-white rounded shadow">New Form</button>
      </div>
  </div>

  <script>
  // ============================================
  // 1. GLOBAL VARIABLES & UTILS
  // ============================================
  let currentStep = 1;
  let studentCount = 0;
  let countries = [];
  let countriesLoaded = false;
  const loadCountriesPromise = loadCountries(); 

  // Format Strings
  function escapeHtml(str) { 
    if (!str) return ''; 
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function checkboxMark(cond){ return cond ? '☑' : '☐' }
  
  function getRadioValue(name){ 
    const r = document.querySelector(`input[name='${name}']:checked`); 
    return r ? r.value : ''; 
  }

  // NAVIGATION LOGIC
  function handleNext() {
      if (currentStep < 6) {
          goTo(currentStep + 1);
      } else {
          generateFinal();
      }
  }

  function handleBack() {
      if (currentStep > 1) {
          goTo(currentStep - 1);
      }
  }

  function goTo(step){
    if (step < 1 || step > 6) return;
    
    // Hide all pages
    document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
    
    // Show target page
    const target = document.querySelector(`.page[data-step='${step}']`);
    if(target) {
        target.classList.remove('hidden');
        currentStep = step;
        
        // Scroll content area to top (not the whole body)
        document.querySelector('.wizard-content').scrollTop = 0;
        
        updateNavButtons();
    }
  }

  function updateNavButtons() {
      const backBtn = document.getElementById('navBackBtn');
      const nextBtn = document.getElementById('navNextBtn');

      // Update Back Button
      if (currentStep === 1) {
          backBtn.classList.add('invisible');
      } else {
          backBtn.classList.remove('invisible');
      }

      // Update Next Button
      if (currentStep === 6) {
          nextBtn.innerHTML = "Generate Yellow Form";
          nextBtn.classList.remove('bg-green-700', 'hover:bg-green-800');
          nextBtn.classList.add('bg-orange-600', 'hover:bg-orange-700');
      } else {
          nextBtn.innerHTML = "Next &rarr;";
          nextBtn.classList.add('bg-green-700', 'hover:bg-green-800');
          nextBtn.classList.remove('bg-orange-600', 'hover:bg-orange-700');
      }
  }

  // Toggles
  function toggleOtherField(id, el){ 
    const inp = document.getElementById(id); 
    if(el.value === 'Other' && el.checked){ 
        inp.classList.remove('hidden'); 
        inp.focus(); 
    } else { 
        inp.classList.add('hidden'); 
        inp.value = ''; 
    }
  }

  function toggleOtherRelation(select){
    const otherBox = document.getElementById('otherRelation');
    if(select.value === 'Other'){ 
        otherBox.classList.remove('hidden'); 
        otherBox.focus(); 
    } else { 
        otherBox.classList.add('hidden'); 
        otherBox.value = ''; 
    }
  }

  function toggleAttendance(isYes){
    const d = document.getElementById('prevDetails');
    if(isYes){ 
        d.disabled = false; 
        d.classList.remove('disabled-input'); 
        d.focus(); 
    } else { 
        d.disabled = true; 
        d.classList.add('disabled-input'); 
        d.value = ''; 
    }
  }

  function toggleLimitedProfile(isYes) {
    const box = document.getElementById('limitedProfileBox');
    if (isYes) { 
        box.classList.remove('hidden'); 
    } else { 
        box.classList.add('hidden'); 
        document.getElementById('limitedProfileDetails').value = ''; 
    }
  }

  // Formatters
  function formatPhone(input) {
    let value = input.value.replace(/\D/g, '');
    if (value.length > 3 && value.length <= 6) {
      input.value = '(' + value.slice(0,3) + ') ' + value.slice(3);
    } else if (value.length > 6) {
      input.value = '(' + value.slice(0,3) + ') ' + value.slice(3,6) + '-' + value.slice(6,10);
    } else {
      input.value = value;
    }
  }

  function enforcePostalFormat(input) {
    let value = input.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    let formatted = '';
    if (value.length > 0) formatted += value[0].replace(/[^A-Z]/g, '');
    if (value.length > 1) formatted += value[1].replace(/[^0-9]/g, '');
    if (value.length > 2) formatted += value[2].replace(/[^A-Z]/g, '');
    if (value.length > 3) formatted += ' ' + value[3].replace(/[^0-9]/g, '');
    if (value.length > 4) formatted += value[4].replace(/[^A-Z]/g, '');
    if (value.length > 5) formatted += value[5].replace(/[^0-9]/g, '');
    input.value = formatted;
  }

  document.addEventListener("input", function (e) {
    if (e.target.type === "date") {
      let v = e.target.value;
      if (v.length >= 5 && v[4] !== "-") {
        let parts = v.split("-");
        if (parts[0].length > 4) { parts[0] = parts[0].substring(0, 4); }
        e.target.value = parts.join("-");
      }
    }
  });

  // Country Loader
  async function loadCountries(){
    try {
      const res = await fetch("https://restcountries.com/v3.1/all?fields=name");
      const data = await res.json();
      countries = data.map(c => c.name?.common).filter(Boolean).sort((a, b) => a.localeCompare(b));
    } catch(err){
      console.error("API Error, using fallback", err);
      countries = ["Afghanistan","Canada","China","Eritrea","Ethiopia","India","Mexico","Philippines","Syria","Ukraine","United States","Vietnam","Other"];
    } finally {
      countriesLoaded = true;
    }
  }

  function populateCountrySelectById(selectEl, selectedValue){
    const $s = $(selectEl);
    $s.empty();
    $s.append($('<option disabled>').text('Select country').prop('selected', !selectedValue).prop('hidden', true));
    
    countries.forEach(c => {
      $s.append($('<option>').val(c).text(c));
    });

    if($s.data('select2')) { $s.select2('destroy'); }
    
    $s.select2({
      width: '100%',
      placeholder: "Search for a country",
      dropdownParent: $(document.body)
    });

    if(selectedValue) { $s.val(selectedValue).trigger('change'); }
  }

  // ============================================
  // 3. DYNAMIC STUDENT ROWS
  // ============================================
  function addStudent(prefill){
    studentCount++;
    const id = studentCount;
    const container = document.getElementById('studentsContainer');
    const wrap = document.createElement('div');
    wrap.className = 'p-4 border rounded bg-gray-50 mb-4 shadow-sm relative';
    wrap.id = `student-${id}`;

    wrap.innerHTML = `
      <div class="flex justify-between items-center mb-2 border-b pb-2">
        <h3 class="font-bold text-gray-700">Student #${id}</h3>
        ${id > 1 ? `<button type="button" class="text-xs text-red-600 underline hover:text-red-800" onclick="removeSpecificStudent(${id})">Remove</button>` : ''}
      </div>
      <div class="grid grid-cols-12 gap-3">
        <div class="col-span-12 md:col-span-3">
            <label class="text-xs font-bold text-gray-700">STUDENT'S SURNAME</label>
            <input type="text" id="s_${id}_surname" class="w-full border rounded p-2 mt-1" value="${prefill?.surname||''}" />
        </div>
        <div class="col-span-12 md:col-span-3">
            <label class="text-xs font-bold text-gray-700">STUDENT'S GIVEN NAME</label>
            <input type="text" id="s_${id}_given" class="w-full border rounded p-2 mt-1" value="${prefill?.given||''}" />
        </div>
        <div class="col-span-12 md:col-span-3">
            <label class="text-xs font-bold text-gray-700">DOB</label>
            <input type="date" id="s_${id}_dob" class="w-full border rounded p-2 mt-1" value="${prefill?.dob||''}" />
        </div>
        <div class="col-span-12 md:col-span-3">
            <label class="text-xs font-bold text-gray-700">BIRTH COUNTRY</label>
            <select id="s_${id}_birth" class="country-select w-full border rounded p-2 mt-1">
                <option disabled selected>Loading...</option>
            </select>
        </div>
      </div>

      <div class="grid grid-cols-12 gap-3 mt-3">
        <div class="col-span-12 md:col-span-4">
            <label class="text-xs font-bold text-gray-700">LAST GRADE COMPLETED</label>
            <select id="s_${id}_lastgrade" class="w-full border rounded p-2 mt-1" onchange="toggleOtherGrade(${id})">
                <option value="" disabled selected hidden>Select grade</option>
                <option value="Pre KG">Pre KG</option>
                <option value="KG">KG</option>
                ${Array.from({length:12},(_,i)=>`<option value="Grade ${i+1}">Grade ${i+1}</option>`).join('')}
                <option value="Other">Other</option>
            </select>
            <input type="text" id="s_${id}_lastgrade_spec" class="w-full border rounded p-2 mt-1 hidden" placeholder="Specify grade" />
        </div>

        <div class="col-span-12 md:col-span-8">
            <label class="text-xs font-bold text-gray-700">PROGRAM</label>
            <div class="mt-1 p-2 border rounded bg-white">
                <div class="flex items-center gap-4">
                    <label class="inline-flex items-center cursor-pointer"><input type="radio" name="s_${id}_progType" value="Regular" class="mr-2" onchange="toggleProgramDropdown(${id})">Regular</label>
                    <label class="inline-flex items-center cursor-pointer"><input type="radio" name="s_${id}_progType" value="Special" class="mr-2" onchange="toggleProgramDropdown(${id})">Special</label>
                </div>
                <select id="s_${id}_prog_dropdown" class="w-full border rounded p-2 mt-2 hidden" onchange="toggleOtherProg(${id})">
                    <option value="" disabled selected hidden>Select program</option>
                    <option value="French Immersion">French Immersion</option>
                    <option value="Spanish Bilingual">Spanish Bilingual</option>
                    <option value="Ukrainian Bilingual">Ukrainian Bilingual</option>
                    <option value="Other">Other</option>
                </select>
                <input type="text" id="s_${id}_prog_spec" class="w-full border rounded p-2 mt-2 hidden" placeholder="Specify program" />
            </div>
        </div>
      </div>

      <div class="grid grid-cols-12 gap-3 mt-3">
        <div class="col-span-12 md:col-span-6">
            <label class="text-xs font-bold text-gray-700">GENDER</label>
            <div class="mt-1 flex items-center gap-6 p-2 border rounded bg-white">
                <label class="inline-flex items-center cursor-pointer"><input type="radio" name="s_${id}_gender" value="F" class="mr-2">F</label>
                <label class="inline-flex items-center cursor-pointer"><input type="radio" name="s_${id}_gender" value="M" class="mr-2">M</label>
            </div>
        </div>
        <div class="col-span-12 md:col-span-6">
            <label class="text-xs font-bold text-gray-700">SCHOOL YEAR</label>
            <div class="mt-1 flex items-center gap-6 p-2 border rounded bg-white">
                <label class="inline-flex items-center cursor-pointer"><input type="radio" name="s_${id}_year" value="ThisYear" class="mr-2">This year</label>
                <label class="inline-flex items-center cursor-pointer"><input type="radio" name="s_${id}_year" value="NextYear" class="mr-2">Next year</label>
            </div>
        </div>
      </div>
    `;
    
    container.appendChild(wrap);

    // Load Countries
    const selectEl = wrap.querySelector(`#s_${id}_birth`);
    if (countriesLoaded) {
      populateCountrySelectById(selectEl, prefill?.birth || '');
    } else {
      loadCountriesPromise.then(()=> populateCountrySelectById(selectEl, prefill?.birth || ''));
    }

    // Only scroll if adding new student via button (not initial load)
    if(studentCount > 1 && !prefill) {
        // Smooth scroll inside the content area
        const contentArea = document.querySelector('.wizard-content');
        contentArea.scrollTo({top: contentArea.scrollHeight, behavior: 'smooth'});
    }
  }

  function removeStudent(){ 
    if(studentCount <= 1) return; 
    const el = document.getElementById(`student-${studentCount}`); 
    if(el) el.remove(); 
    studentCount--; 
  }
  
  function removeSpecificStudent(id) {
    // Basic removal, note: IDs might get non-sequential but iteration handles it by checking existence
    const el = document.getElementById(`student-${id}`);
    if(el) el.remove();
  }

  function toggleOtherGrade(id){
    const sel = document.getElementById(`s_${id}_lastgrade`);
    const spec = document.getElementById(`s_${id}_lastgrade_spec`);
    if(sel.value === 'Other'){ spec.classList.remove('hidden'); spec.focus(); } 
    else { spec.classList.add('hidden'); spec.value = ''; }
  }

  function toggleProgramDropdown(id){
    const radios = document.getElementsByName(`s_${id}_progType`);
    const dropdown = document.getElementById(`s_${id}_prog_dropdown`);
    const spec = document.getElementById(`s_${id}_prog_spec`);
    let chosen = '';
    radios.forEach(r => { if(r.checked) chosen = r.value });

    if(chosen === 'Special'){
      dropdown.classList.remove('hidden');
    } else {
      dropdown.classList.add('hidden'); dropdown.value = '';
      spec.classList.add('hidden'); spec.value = '';
    }
  }

  function toggleOtherProg(id){
    const sel = document.getElementById(`s_${id}_prog_dropdown`);
    const spec = document.getElementById(`s_${id}_prog_spec`);
    if(sel.value === 'Other'){ spec.classList.remove('hidden'); spec.focus(); } 
    else { spec.classList.add('hidden'); spec.value = ''; }
  }


  // ============================================
  // 4. GENERATE FINAL FORM
  // ============================================
  function generateFinal(){
    const final = document.getElementById('finalArea');
    final.innerHTML = '';
    
    // --- HEADER ---
    final.insertAdjacentHTML('beforeend', `
      <div class="flex items-center justify-between mb-6 ml-6 mr-6 gap-4">

    const tbl = document.createElement('table');

    const c = (lbl, val) => `<div class="font-semibold">${lbl}</div><div class="cell-content">${escapeHtml(val)}</div>`;

      <td width="15%">${c('CONTACT PHONE #', document.getElementById('contactPhone').value)}</td>
      <td width="20%">${c('CONTACT RELATIONSHIP', getContactRel())}</td>
    `;
    tbl.appendChild(tr1);

    // ROW 2
    const sStatus = getRadioValue('studentStatus');
    const sStatusTxt = sStatus === 'Other' ? (document.getElementById('studentStatusOther').value || 'Other') : sStatus;
    
    const imm = getRadioValue('immDoc');
    const immTxt = imm === 'Other' ? (document.getElementById('immDocOther').value || 'Other') : imm;

    // ROW 3
    const tr3 = document.createElement('tr');
    tr3.innerHTML = `
      <td colspan="5" class="no-padding">
        <table class="nested-table">
          <tr>
            <td width="25%">${c("FATHER'S SURNAME", document.getElementById('fatherSurname').value)}</td>
            <td width="25%">${c("FATHER'S GIVEN NAME", document.getElementById('fatherGiven').value)}</td>
            <td width="25%">${c("MOTHER'S SURNAME", document.getElementById('motherSurname').value)}</td>
            <td width="25%">${c("MOTHER'S GIVEN NAME", document.getElementById('motherGiven').value)}</td>
          </tr>
        </table>
      </td>
    `;
    tbl.appendChild(tr3);

    // ROW 4
    const tr4 = document.createElement('tr');
    tr4.innerHTML = `
      <td colspan="5" class="no-padding">
        <table class="nested-table">
          <tr>
            <td width="20%">${c("APARTMENT #", document.getElementById('apt').value)}</td>
            <td width="60%">${c("FAMILY ADDRESS", document.getElementById('address').value)}</td>
            <td width="20%">${c("POSTAL CODE", document.getElementById('postal').value)}</td>
          </tr>
        </table>
      </td>
    `;
    tbl.appendChild(tr4);

    // ROW 5
    let homeLangs = '';
    const hlSelect = document.getElementById('homeLang');
    if (hlSelect.tomselect) {
        const val = hlSelect.tomselect.getValue();
        homeLangs = Array.isArray(val) ? val.join(', ') : val;
    } else {
        homeLangs = Array.from(hlSelect.selectedOptions).map(o=>o.value).join(', ');
    }
    
    const cathVal = getRadioValue('catholic');
    const relOther = document.getElementById('religionOther').value;
    const cathTxt = `${checkboxMark(cathVal==='Yes')} Yes  ${checkboxMark(cathVal==='No')} No` + (relOther ? `<br><strong>Note:</strong> ${escapeHtml(relOther)}` : '');

    const tr5 = document.createElement('tr');
    tr5.innerHTML = `
      <td colspan="5" class="no-padding">
        <table class="nested-table">
          <tr>
            <td width="33%">${c("FAMILY PHONE #", document.getElementById('familyPhone').value)}</td>

            <td width="33%">${c("CATHOLIC", cathTxt)}</td>
          </tr>
        </table>
      </td>
    `;
    tbl.appendChild(tr5);

    // ROW 6: STUDENTS
    let stRows = '';
    // Loop through possible student IDs based on current count
    for(let i=1; i<=studentCount; i++){
        // Check if element exists (in case middle ones were deleted)
        if(document.getElementById(`s_${i}_surname`)){
            const sn = document.getElementById(`s_${i}_surname`).value;
            const gn = document.getElementById(`s_${i}_given`).value;
            const dob = document.getElementById(`s_${i}_dob`).value;
            const birth = document.getElementById(`s_${i}_birth`).value;

            const year = getRadioValue(`s_${i}_year`) === 'ThisYear' ? 'This year' : 'Next year';
            
            let prog = '';
            const pt = getRadioValue(`s_${i}_progType`);
            if(pt === 'Regular') prog = 'Regular';
            else if(pt === 'Special') {
                const pd = document.getElementById(`s_${i}_prog_dropdown`).value;
                const ps = document.getElementById(`s_${i}_prog_spec`).value;
                prog = `Special - ${pd === 'Other' ? ps : pd}`;
            }

            let grd = document.getElementById(`s_${i}_lastgrade`).value;
            if(grd === 'Other') grd = document.getElementById(`s_${i}_lastgrade_spec`).value;

            stRows += `<tr class="student-row">

             <th width="18%">GIVEN NAME</th>
             <th width="8%">GENDER</th>

             <th width="10%">LAST GRADE</th>

    tbl.appendChild(tr6);

    // ROW 7
    const lim = getRadioValue('limitedProfile');

    const tr7 = document.createElement('tr');
    tr7.innerHTML = `<td colspan="5">
        <div class="font-semibold">POTENTIAL LIMITED FORMAL SCHOOLING PROFILE</div>
        <div>${checkboxMark(lim==='Yes')} Yes  ${checkboxMark(lim==='No')} No</div>

    </td>`;
    tbl.appendChild(tr7);

    // ROW 8
    const notes = document.getElementById('notes').value;
    const tr8 = document.createElement('tr');
    tr8.innerHTML = `<td colspan="5">
        <div class="font-semibold">NOTES</div>
        <div class="cell-content" style="padding-left:20px;">${escapeHtml(notes)}</div>
    </td>`;
    tbl.appendChild(tr8);

    final.appendChild(tbl);
    
    // Switch Views
    document.getElementById('wizardRoot').classList.add('hidden');
    document.getElementById('finalWrap').classList.remove('hidden');
    window.scrollTo({top:0, behavior:'smooth'});

  // ============================================
  // 5. INITIALIZATION & EVENTS

    $('#contactRel').select2({

    const select = document.getElementById('homeLang');

  // PDF LOGIC
  function downloadPDF(orientation) {
    const final = document.getElementById('finalArea');
    final.classList.add('pdf-scale');
    document.getElementById('orientationSelector').classList.add('hidden');
    
    const opt = { 
        margin: 0.2, 
        filename: `intake-form-${document.getElementById('date').value}.pdf`, 
        image: { type: 'jpeg', quality: 0.98 }, 
        html2canvas: { scale: 2, useCORS: true }, 
        jsPDF: { unit: 'in', format: 'letter', orientation: orientation } 
    };
    
    html2pdf().set(opt).from(final).save().then(() => {
        final.classList.remove('pdf-scale');
    });
  }

  // BUTTON HANDLERS
  document.getElementById('editBtn').onclick = () => {
    document.getElementById('wizardRoot').classList.remove('hidden');
    document.getElementById('finalWrap').classList.add('hidden');
    document.getElementById('orientationSelector').classList.add('hidden'); 
    window.scrollTo({top:0, behavior:'smooth'});
  }

  document.getElementById('pdfBtn').onclick = (event) => {
    event.stopPropagation(); 
    const sel = document.getElementById('orientationSelector');
    sel.classList.toggle('hidden');
    
    // Position menu above button
    const btnRect = event.target.getBoundingClientRect();
    sel.style.bottom = "100%"; // Simple positioning via CSS class
  }

  document.getElementById('downloadPortraitBtn').onclick = () => downloadPDF('portrait');
  document.getElementById('downloadLandscapeBtn').onclick = () => downloadPDF('landscape');

  document.addEventListener('click', function(event) {
    const selector = document.getElementById('orientationSelector');
    const pdfBtn = document.getElementById('pdfBtn');
    if (!selector.classList.contains('hidden') && !selector.contains(event.target) && event.target !== pdfBtn) {
        selector.classList.add('hidden');
    }
  });

  document.getElementById('newFormBtn').onclick = () => { 
    if(!confirm("Start new form? Current data will be lost.")) return; 
    location.reload(); 
  };
  
  // Initialize Buttons
  updateNavButtons();
  
  </script>
