<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>One World One Centre Wizard</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- html2pdf -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.3/html2pdf.bundle.min.js"></script>

  <!-- jQuery + Select2 -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

  <style>
    /* --- Page layout --- */
    body {
      margin: 0;
      min-height: 100vh;
      background-color: #f3f4f6;
      font-family: sans-serif;
    }

    .wizard {
      max-width: 1100px;
      margin: 2rem auto;
      padding: 2rem;
      background-color: white;
      border-radius: 0.5rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .page {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 70vh;
      padding: 1.5rem;
      border-radius: 0.5rem;
      background-color: white;
    }

    .nav-buttons {
      display: flex;
      justify-content: space-between;
      margin-top: auto;
      padding-top: 1rem;
    }

    .disabled-input {
      background: #f3f4f6;
      color: #6b7280;
    }

    .yellow-bg {
      background: #FFF9C4;
    }

    .checkbox-box {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 1px solid #111;
      text-align: center;
      line-height: 18px;
      font-weight: 700;
      margin-right: 6px;
    }

    .muted {
      color: #6b7280;
    }

    table.yellow-table,
    table.yellow-table td,
    table.yellow-table th {
      border: 1px solid #000 !important;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    table.yellow-table td,
    table.yellow-table th {
      padding: 6px;
      vertical-align: top;
    }

    /* --- Print styling --- */
    @media print {
      body {
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        background: white;
      }

      .wizard {
        display: none;
      }

      .final-wrap {
        display: block;
      }

      #finalArea {
        width: 148mm;   /* A5 width */
        height: 210mm;  /* A5 height */
        margin: 0 auto;
        padding: 10mm;
        page-break-after: always;
      }

      #printBtn,
      #pdfBtn,
      #editBtn {
        display: none !important;
      }

      @page {
        size: A5 portrait;
        margin: 0;
      }
    }
  </style>
</head>
<body>

<div class="max-w-5xl mx-auto p-6">

  <!-- WIZARD HEADER -->
  <h1 class="text-xl font-semibold mb-6 ml-6">INFORMATION NEEDED FOR BOOKING APPOINTMENTS AND SENDING REQUESTS</h1>

  <!-- WIZARD -->
  <div id="wizardRoot" class="wizard">

    <!-- PAGE 1 -->
    <section class="page" data-step="1">
      <h2 class="font-medium mb-3">Page 1</h2>
      <div class="grid grid-cols-12 gap-3">
        <!-- DATE -->
        <div class="col-span-2">
          <label class="block text-sm">DATE</label>
          <input id="date" type="date" class="w-full border rounded p-2 mt-1" />
        </div>

        <!-- TAKEN BY -->
        <div class="col-span-3">
          <label class="block text-sm">TAKEN BY</label>
          <input id="takenBy" type="text" class="w-full border rounded p-2 mt-1" placeholder="Name" />
        </div>

        <!-- CONTACT NAME / SURNAME -->
        <div class="col-span-4">
          <label class="block text-sm">CONTACT NAME / SURNAME</label>
          <input id="contactName" type="text" class="w-full border rounded p-2 mt-1" />
        </div>

        <!-- CONTACT PHONE # -->
        <div class="col-span-2">
          <label class="block text-sm">CONTACT PHONE #</label>
          <input 
            id="contactPhone" 
            type="text" 
            maxlength="14" 
            class="w-full border rounded p-2 mt-1" 
            placeholder="(123) 456-7890"
            oninput="formatPhone(this)" 
          />
        </div>

        <!-- CONTACT RELATIONSHIP -->
        <div class="col-span-4">
          <label for="contactRel" class="block text-sm mt-6">CONTACT RELATIONSHIP</label>
          <select id="contactRel" name="contactRel" class="border rounded p-3 w-72" onchange="toggleOtherRelation(this)">
            <option value="" disabled selected hidden>-- Select Relation --</option>
            <option>Mother</option><option>Father</option><option>Sister</option><option>Brother</option>
            <option>Step-Mother</option><option>Step-Father</option><option>Half-Sister</option><option>Half-Brother</option>
            <option>Uncle</option><option>Aunt</option><option>Cousin</option><option>Grandmother</option>
            <option>Grandfather</option><option>Guardian</option><option>Sponsor</option><option>Family Friend</option>
            <option>Neighbor</option><option>Community Worker</option><option>Social Worker</option><option>Other</option>
          </select>
          <input type="text" id="otherRelation" class="border rounded p-2 w-72 mt-2 hidden" placeholder="Please specify" />
        </div>
      </div>

      <!-- Navigation -->
      <div class="nav-buttons justify-end">
        <button type="button" class="px-4 py-2 bg-green-700 text-white rounded" onclick="goTo(2)">Next</button>
      </div>
    </section>

    <!-- PAGE 2 -->
    <section class="page hidden" data-step="2">
      <h2 class="font-medium mb-3">Page 2</h2>
      <div class="grid grid-cols-12 gap-3 mb-3">
        <!-- Student Status -->
        <div class="col-span-6">
          <label class="block text-sm">STUDENT'S STATUS</label>
          <div class="mt-1 flex flex-wrap gap-3 items-center">
            <label><input type="radio" name="studentStatus" value="PR" onchange="toggleOtherField('studentStatusOther', this)">PR</label>
            <label><input type="radio" name="studentStatus" value="RC" onchange="toggleOtherField('studentStatusOther', this)">RC</label>
            <label><input type="radio" name="studentStatus" value="SP" onchange="toggleOtherField('studentStatusOther', this)">SP</label>
            <label><input type="radio" name="studentStatus" value="WP" onchange="toggleOtherField('studentStatusOther', this)">WP</label>
            <label><input type="radio" name="studentStatus" value="Other" onchange="toggleOtherField('studentStatusOther', this)">Other</label>
            <input id="studentStatusOther" type="text" class="hidden border rounded p-2 ml-2" placeholder="Specify" />
          </div>
        </div>

        <!-- Immigration Document -->
        <div class="col-span-6">
          <label class="block text-sm">IMMIGRATION DOCUMENT (OF NATURAL PARENT / GUARDIAN)</label>
          <div class="mt-1 flex flex-wrap gap-3 items-center">
            <label><input type="radio" name="immDoc" value="PR" onchange="toggleOtherField('immDocOther', this)">PR</label>
            <label><input type="radio" name="immDoc" value="RC" onchange="toggleOtherField('immDocOther', this)">RC</label>
            <label><input type="radio" name="immDoc" value="SP" onchange="toggleOtherField('immDocOther', this)">SP</label>
            <label><input type="radio" name="immDoc" value="WP" onchange="toggleOtherField('immDocOther', this)">WP</label>
            <label><input type="radio" name="immDoc" value="Other" onchange="toggleOtherField('immDocOther', this)">Other</label>
            <input id="immDocOther" type="text" class="hidden border rounded p-2 ml-2" placeholder="Specify" />
          </div>
        </div>
      </div>

      <!-- Navigation -->
      <div class="nav-buttons">
        <button type="button" class="px-4 py-2 bg-gray-500 text-white rounded" onclick="goTo(1)">Back</button>
        <button type="button" class="px-4 py-2 bg-green-700 text-white rounded" onclick="goTo(3)">Next</button>
      </div>
    </section>

    <!-- PAGE 3 (Students List / Add Student) -->
    <section class="page hidden" data-step="3">
      <h2 class="font-medium mb-3">Student Details</h2>
      <div id="studentsContainer" class="space-y-4"></div>
      <button type="button" class="px-4 py-2 bg-blue-600 text-white rounded mt-3" onclick="addStudent()">Add Student</button>

      <!-- Navigation -->
      <div class="nav-buttons">
        <button type="button" class="px-4 py-2 bg-gray-500 text-white rounded" onclick="goTo(2)">Back</button>
        <button type="button" class="px-4 py-2 bg-green-700 text-white rounded" onclick="goTo(4)">Next</button>
      </div>
    </section>

    <!-- PAGE 4 (Final Notes / Yellow Form) -->
    <section class="page hidden yellow-bg" data-step="4">
      <h2 class="font-medium mb-3">Final Notes</h2>
      <p class="mb-3">Number of years as refugees, country of relocation, refugee camp name, nature of schooling, parent country of origin</p>
      <table class="yellow-table w-full">
        <thead>
          <tr>
            <th>Student Name</th>
            <th>Grade</th>
            <th>Note</th>
          </tr>
        </thead>
        <tbody id="finalStudentsTable"></tbody>
      </table>

      <!-- Action buttons -->
      <div class="nav-buttons mt-6">
        <button type="button" class="px-4 py-2 bg-gray-500 text-white rounded" onclick="goTo(3)">Back</button>
        <button id="printBtn" type="button" class="px-4 py-2 bg-blue-600 text-white rounded" onclick="printFinal()">Print</button>
        <button id="pdfBtn" type="button" class="px-4 py-2 bg-purple-600 text-white rounded" onclick="downloadPDF()">Download PDF</button>
        <button id="editBtn" type="button" class="px-4 py-2 bg-yellow-700 text-white rounded" onclick="goTo(1)">Edit</button>
      </div>
    </section>
  </div>
</div>

<script>
  let currentStep = 1;

  function goTo(step) {
    document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
    const nextPage = document.querySelector(`.page[data-step="${step}"]`);
    if(nextPage) nextPage.classList.remove('hidden');
    currentStep = step;
    if(step === 4) populateFinalTable();
  }

  function toggleOtherField(id, radio) {
    const field = document.getElementById(id);
    field.classList.toggle('hidden', radio.value !== 'Other');
  }

  function toggleOtherRelation(select) {
    const other = document.getElementById('otherRelation');
    other.classList.toggle('hidden', select.value !== 'Other');
  }

  function formatPhone(input) {
    let val = input.value.replace(/\D/g, '');
    if(val.length > 3 && val.length <= 6) val = `(${val.slice(0,3)}) ${val.slice(3)}`;
    else if(val.length > 6) val = `(${val.slice(0,3)}) ${val.slice(3,6)}-${val.slice(6,10)}`;
    input.value = val;
  }

  let studentCount = 0;
  function addStudent() {
    studentCount++;
    const container = document.getElementById('studentsContainer');
    const div = document.createElement('div');
    div.id = `student${studentCount}`;
    div.className = 'border rounded p-3';

    div.innerHTML = `
      <div class="grid grid-cols-12 gap-3">
        <div class="col-span-6">
          <label class="block text-sm">Student Name</label>
          <input type="text" class="w-full border rounded p-2" placeholder="Full Name">
        </div>
        <div class="col-span-3">
          <label class="block text-sm">Grade</label>
          <input type="text" class="w-full border rounded p-2" placeholder="Grade 1-12">
        </div>
        <div class="col-span-3 flex items-end">
          <button type="button" class="px-3 py-1 bg-red-600 text-white rounded" onclick="removeStudent(${studentCount})">Remove</button>
        </div>
      </div>
    `;
    container.appendChild(div);
  }

  function removeStudent(id) {
    const div = document.getElementById(`student${id}`);
    if(div) div.remove();
  }

  function populateFinalTable() {
    const tableBody = document.getElementById('finalStudentsTable');
    tableBody.innerHTML = '';
    document.querySelectorAll('#studentsContainer > div').forEach(studentDiv => {
      const name = studentDiv.querySelector('input[type="text"]').value || '';
      const grade = studentDiv.querySelectorAll('input[type="text"]')[1].value || '';
      tableBody.innerHTML += `<tr><td>${name}</td><td>${grade}</td><td>Note</td></tr>`;
    });
  }

  function printFinal() {
    window.print();
  }

  function downloadPDF() {
    const element = document.getElementById('wizardRoot');
    html2pdf().set({ margin:0.5, filename:'Form.pdf', html2canvas:{scale:2} }).from(element).save();
  }

  // Initialize first step
  goTo(1);
</script>

</body>
</html>
