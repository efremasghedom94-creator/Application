<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>One World One Centre Student Intake Form</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.3/html2pdf.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

  <link href="https://cdn.jsdelivr.net/npm/tom-select/dist/css/tom-select.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/tom-select/dist/js/tom-select.complete.min.js"></script>

  <style>
    /* GLOBAL BOX SIZING FIX */
    *, *::before, *::after { box-sizing: border-box; }

    /* BASIC LAYOUT */
    body { 
        margin: 0; 
        /* Border only on larger screens to save space on mobile */
        min-height: 100vh; 
        background-color: white; 
    }
    
    @media (min-width: 768px) {
        body { border: 3px solid #C7631C; }
    }

    .wizard { 
        background-color: white; 
        border-radius: 0.5rem; 
        padding: 1rem; /* Reduced padding for mobile */
        margin: 1rem auto; 
        max-width: 1100px; 
        box-shadow: 0 2px 6px rgba(0,0,0,0.1); 
    }
    
    @media (min-width: 768px) {
        .wizard { padding: 2rem; margin: 2rem auto; }
    }

    .page { 
        position: relative; 
        min-height: 60vh; 
        background-color: white; 
        padding: 0.5rem; 
        border-radius: 0.5rem; 
        display: flex; 
        flex-direction: column; 
        justify-content: space-between; 
    }
    
    .nav-buttons { 
        display: flex; 
        justify-content: space-between; 
        margin-top: auto; 
        padding-top: 2rem; 
    }
    
    /* INPUT STYLES */
    select { transform-origin: top center !important; }
    .disabled-input { background:#f3f4f6; color:#6b7280; pointer-events: none; }
    
    /* YELLOW TABLE STYLING */
    table.yellow-table { width: 100%; border-collapse: collapse; border: 2px solid black; font-size: 0.8rem; table-layout: fixed; min-width: 700px; /* Ensure table doesn't crush on mobile */ }
    table.yellow-table td, table.yellow-table th { border: 1px solid black; padding: 4px 6px; vertical-align: top; word-wrap: break-word; overflow-wrap: anywhere; }
    
    /* Nested Tables */
    table.nested-table { width: 100%; border-collapse: collapse; margin: -1px; width: calc(100% + 2px); table-layout: fixed; }
    table.nested-table td { border: 1px solid black !important; border-top: none !important; border-bottom: none !important; }
    
    /* Student Row Specifics */
    tr.student-row td { border-bottom: 1px solid black !important; }
    tr.student-row:last-child td { border-bottom: none !important; }
    table.nested-table td:first-child { border-left: none !important; }
    table.nested-table td:last-child { border-right: none !important; }
    td.no-padding { padding: 0 !important; height: 100%; }

    /* Text Formatting */
    .font-semibold { font-weight: 700; margin-bottom: 2px; font-size: 0.75rem; text-transform: uppercase; }
    .cell-content { width: 100%; min-height: 18px; word-break: break-word; overflow-wrap: anywhere; }

    /* PDF Print Specifics */
    #finalArea.pdf-scale { width: 100%; font-size: 10px !important; }
    
    /* Library Tweaks */
    .select2-container .select2-selection--single { height: 42px; border: 1px solid #d1d5db; padding: 6px; }
    .select2-container--default .select2-selection--single .select2-selection__arrow { height: 42px; top: 0; }
    
    /* Mobile Scroll for Table */
    .table-responsive {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
    }
  </style>
</head>

<body class="bg-gray-100 text-gray-800">
  <div class="max-w-5xl mx-auto p-2 md:p-6">
    <div id="wizardRoot" class="wizard bg-white rounded-lg shadow">

    <div class="flex flex-col md:flex-row items-center justify-between mb-6 gap-4 border-b pb-4">
        <h1 class="text-lg md:text-xl font-semibold leading-tight text-center md:text-left">
            INFORMATION NEEDED FOR BOOKING APPOINTMENTS AND SENDING REQUESTS
        </h1>
        <img src="One World Logo.jpg" alt="One World One Centre Logo" class="w-48 md:w-80 h-auto object-contain flex-shrink-0">
    </div>

      <section class="page" data-step="1">
        <h2 class="font-medium mb-3 text-lg border-b pb-1">Page 1: Contact Info</h2>
        <div class="grid grid-cols-12 gap-3">
          <div class="col-span-12 md:col-span-2">
            <label class="block text-sm font-bold">DATE</label>
            <input id="date" type="date" class="w-full border rounded p-2 mt-1" />
          </div>
          <div class="col-span-12 md:col-span-3">
            <label class="block text-sm font-bold">TAKEN BY</label>
            <input id="takenBy" type="text" class="w-full border rounded p-2 mt-1" />
          </div>
          <div class="col-span-12 md:col-span-4">
            <label class="block text-sm font-bold">CONTACT NAME / SURNAME</label>
            <input id="contactName" type="text" class="w-full border rounded p-2 mt-1" />
          </div>
          <div class="col-span-12 md:col-span-3">
            <label class="block text-sm font-bold">CONTACT PHONE #</label>
            <input id="contactPhone" type="tel" maxlength="14" class="w-full border rounded p-2 mt-1" oninput="formatPhone(this)" />
          </div>
          
          <div class="col-span-12 md:col-span-6 mt-4">
            <label class="block text-sm font-bold mb-1">CONTACT RELATIONSHIP</label>
            <select id="contactRel" class="border rounded p-3 w-full" onchange="toggleOtherRelation(this)">
              <option value="" disabled selected hidden>-- Select --</option>
              <option value="Mother">Mother</option>
              <option value="Father">Father</option>
              <option value="Sister">Sister</option>
              <option value="Brother">Brother</option>
              <option value="Step-Mother">Step-Mother</option>
              <option value="Step-Father">Step-Father</option>
              <option value="Half-Sister">Half-Sister</option>
              <option value="Half-Brother">Half-Brother</option>
              <option value="Uncle">Uncle</option>
              <option value="Aunt">Aunt</option>
              <option value="Cousin">Cousin</option>
              <option value="Grandmother">Grandmother</option>
              <option value="Grandfather">Grandfather</option>
              <option value="Guardian">Guardian</option>
              <option value="Sponsor">Sponsor</option>
              <option value="Family Friend">Family Friend</option>
              <option value="Neighbor">Neighbor</option>
              <option value="Community Worker">Community Worker</option>
              <option value="Social Worker">Social Worker</option>
              <option value="Other">Other</option>
            </select>
            <input type="text" id="otherRelation" class="border rounded p-2 w-full mt-2 hidden" placeholder="Specify" />
          </div>
        </div>
        <div class="nav-buttons justify-end">
          <button type="button" class="w-full md:w-auto px-6 py-3 bg-green-700 text-white rounded font-bold shadow hover:bg-green-800 transition" onclick="goTo(2)">Next</button>
        </div>
      </section>

      <section class="page hidden" data-step="2">
        <h2 class="font-medium mb-3 text-lg border-b pb-1">Page 2: Status & History</h2>
        <div class="grid grid-cols-12 gap-3 mb-3">
          <div class="col-span-12 md:col-span-6">
            <label class="block text-sm font-bold">STUDENT'S STATUS</label>
            <div class="mt-1 flex flex-wrap gap-3 p-2 bg-gray-50 rounded border">
              <label class="flex items-center"><input type="radio" name="studentStatus" value="PR" class="mr-1" onchange="toggleOtherField('studentStatusOther', this)"> PR</label>
              <label class="flex items-center"><input type="radio" name="studentStatus" value="RC" class="mr-1" onchange="toggleOtherField('studentStatusOther', this)"> RC</label>
              <label class="flex items-center"><input type="radio" name="studentStatus" value="WP" class="mr-1" onchange="toggleOtherField('studentStatusOther', this)"> WP</label>
              <label class="flex items-center"><input type="radio" name="studentStatus" value="Other" class="mr-1" onchange="toggleOtherField('studentStatusOther', this)"> Other</label>
            </div>
            <input id="studentStatusOther" type="text" class="hidden w-full border rounded p-2 mt-2" placeholder="Specify" />
          </div>
          
          <div class="col-span-12 md:col-span-6">
            <label class="block text-sm font-bold">IMMIGRATION DOC (PARENT)</label>
            <div class="mt-1 flex flex-wrap gap-3 p-2 bg-gray-50 rounded border">
              <label class="flex items-center"><input type="radio" name="immDoc" value="PR" class="mr-1" onchange="toggleOtherField('immDocOther', this)"> PR</label>
              <label class="flex items-center"><input type="radio" name="immDoc" value="RC" class="mr-1" onchange="toggleOtherField('immDocOther', this)"> RC</label>
              <label class="flex items-center"><input type="radio" name="immDoc" value="WP" class="mr-1" onchange="toggleOtherField('immDocOther', this)"> WP</label>
              <label class="flex items-center"><input type="radio" name="immDoc" value="Other" class="mr-1" onchange="toggleOtherField('immDocOther', this)"> Other</label>
            </div>
            <input id="immDocOther" type="text" class="hidden w-full border rounded p-2 mt-2" placeholder="Specify" />
          </div>
          
          <div class="col-span-12 md:col-span-6 mt-2">
            <label class="block text-sm font-bold">EXPIRY DATE</label>
            <input id="expiry" type="date" class="w-full border rounded p-2 mt-1" />
          </div>
          
          <div class="col-span-12 md:col-span-6 mt-2">
            <label class="block text-sm font-bold">DATE LANDED</label>
            <input id="landed" type="date" class="w-full border rounded p-2 mt-1" />
          </div>

          <div class="col-span-12 mt-4 border-t pt-4">
            <label class="block text-sm font-bold">PREVIOUS ATTENDANCE IN CANADIAN SCHOOLS?</label>
            <div class="mt-2 flex gap-6">
              <label class="flex items-center"><input type="radio" name="prevAttend" value="No" class="mr-2 transform scale-125" onchange="toggleAttendance(false)"> No</label>
              <label class="flex items-center"><input type="radio" name="prevAttend" value="Yes" class="mr-2 transform scale-125" onchange="toggleAttendance(true)"> Yes</label>
            </div>
            <input id="prevDetails" type="text" class="mt-2 w-full border rounded p-2 disabled-input" placeholder="Details (School Name, Grade)..." disabled />
          </div>
        </div>
        
        <div class="nav-buttons">
          <button type="button" class="w-1/3 md:w-auto px-4 py-2 bg-gray-500 text-white rounded shadow hover:bg-gray-600 transition" onclick="goTo(1)">Back</button>
          <button type="button" class="w-1/3 md:w-auto px-4 py-2 bg-green-700 text-white rounded shadow hover:bg-green-800 transition" onclick="goTo(3)">Next</button>
        </div>
      </section>

      <section class="page hidden" data-step="3">
        <h2 class="font-medium mb-3 text-lg border-b pb-1">Page 3: Parents</h2>
        <div class="grid grid-cols-12 gap-4">
          <div class="col-span-12 md:col-span-6">
            <label class="block text-sm font-bold">FATHER'S SURNAME</label>
            <input id="fatherSurname" type="text" class="w-full border rounded p-2 mt-1" />
          </div>
          <div class="col-span-12 md:col-span-6">
            <label class="block text-sm font-bold">FATHER'S GIVEN NAME</label>
            <input id="fatherGiven" type="text" class="w-full border rounded p-2 mt-1" />
          </div>
          <div class="col-span-12 border-b my-2 md:hidden"></div> <div class="col-span-12 md:col-span-6">
            <label class="block text-sm font-bold">MOTHER'S SURNAME</label>
            <input id="motherSurname" type="text" class="w-full border rounded p-2 mt-1" />
          </div>
          <div class="col-span-12 md:col-span-6">
            <label class="block text-sm font-bold">MOTHER'S GIVEN NAME</label>
            <input id="motherGiven" type="text" class="w-full border rounded p-2 mt-1" />
          </div>
        </div>
        <div class="nav-buttons">
          <button type="button" class="w-1/3 md:w-auto px-4 py-2 bg-gray-500 text-white rounded shadow hover:bg-gray-600 transition" onclick="goTo(2)">Back</button>
          <button type="button" class="w-1/3 md:w-auto px-4 py-2 bg-green-700 text-white rounded shadow hover:bg-green-800 transition" onclick="goTo(4)">Next</button>
        </div>
      </section>

      <section class="page hidden" data-step="4">
        <h2 class="font-medium mb-3 text-lg border-b pb-1">Page 4: Address & Language</h2>
        <div class="grid grid-cols-12 gap-3">
          <div class="col-span-4 md:col-span-2">
            <label class="block text-sm font-bold">APT #</label>
            <input id="apt" type="text" class="w-full border rounded p-2 mt-1" />
          </div>
          <div class="col-span-8 md:col-span-7">
            <label class="block text-sm font-bold">FAMILY ADDRESS</label>
            <input id="address" type="text" class="w-full border rounded p-2 mt-1" />
          </div>
          <div class="col-span-12 md:col-span-3">
            <label class="block text-sm font-bold">POSTAL CODE</label>
            <input id="postal" type="text" class="w-full border rounded p-2 mt-1" oninput="enforcePostalFormat(this)" />
          </div>
          
          <div class="col-span-12 md:col-span-4 mt-2">
            <label class="block text-sm font-bold">FAMILY PHONE #</label>
            <input id="familyPhone" type="tel" class="w-full border rounded p-2 mt-1" oninput="formatPhone(this)" />
          </div>
          
          <div class="col-span-12 md:col-span-8 mt-2">
            <label class="block text-sm font-bold">HOME LANGUAGE(S)</label>
            <select id="homeLang" multiple class="w-full border rounded p-2 mt-1"></select>
          </div>
          
          <div class="col-span-12 mt-4 p-3 bg-blue-50 rounded border border-blue-100">
            <label class="block text-sm font-bold">CATHOLIC RATEPAYER?</label>
            <div class="flex gap-6 mt-2">
                <label class="flex items-center"><input type="radio" name="catholic" value="No" class="mr-2"> No</label>
                <label class="flex items-center"><input type="radio" name="catholic" value="Yes" class="mr-2"> Yes</label>
            </div>
            <input id="religionOther" type="text" class="mt-2 w-full border rounded p-2 bg-white" placeholder="If not Catholic, specify..." />
          </div>
        </div>
        <div class="nav-buttons mt-4">
          <button type="button" class="w-1/3 md:w-auto px-4 py-2 bg-gray-500 text-white rounded shadow hover:bg-gray-600 transition" onclick="goTo(3)">Back</button>
          <button type="button" class="w-1/3 md:w-auto px-4 py-2 bg-green-700 text-white rounded shadow hover:bg-green-800 transition" onclick="goTo(5)">Next</button>
        </div>
      </section>

      <section class="page hidden" data-step="5">
        <h2 class="font-medium mb-3 text-lg border-b pb-1">Page 5 — Student Details</h2>
        <div id="studentsContainer" class="space-y-6"></div>
        
        <div class="flex flex-col md:flex-row items-center gap-3 mt-6 border-t pt-4">
          <button class="w-full md:w-auto px-4 py-2 bg-blue-600 text-white rounded shadow hover:bg-blue-700 transition" onclick="addStudent()" type="button">+ Add Another Student</button>
          <button class="w-full md:w-auto px-4 py-2 bg-red-100 text-red-700 border border-red-300 rounded hover:bg-red-200 transition" onclick="removeStudent()" type="button">Remove Last Student</button>
        </div>
        
        <div class="nav-buttons">
          <button type="button" class="w-1/3 md:w-auto px-4 py-2 bg-gray-500 text-white rounded shadow hover:bg-gray-600 transition" onclick="goTo(4)">Back</button>
          <button type="button" class="w-1/3 md:w-auto px-4 py-2 bg-green-700 text-white rounded shadow hover:bg-green-800 transition" onclick="goTo(6)">Next</button>
        </div>
      </section>

      <section class="page hidden" data-step="6">
        <h2 class="font-medium mb-3 text-lg border-b pb-1">Page 6: Final Notes</h2>
        <div class="grid grid-cols-12 gap-3">
            <div class="col-span-12">
                <label class="block text-sm font-bold">LIMITED FORMAL SCHOOLING?</label>
                <div class="flex gap-6 mt-2 p-2 bg-gray-50 border rounded">
                    <label class="flex items-center"><input type="radio" name="limitedProfile" value="No" onchange="toggleLimitedProfile(false)" class="mr-2"> No</label>
                    <label class="flex items-center"><input type="radio" name="limitedProfile" value="Yes" onchange="toggleLimitedProfile(true)" class="mr-2"> Yes</label>
                </div>
            </div>
        </div>
        <div id="limitedProfileBox" class="col-span-12 mt-4 hidden">
            <label class="block text-sm font-bold">Details:</label>
            <textarea id="limitedProfileDetails" rows="3" class="w-full border rounded p-2 mt-1"></textarea>
        </div>
        <div class="col-span-12 mt-4">
            <label class="block text-sm font-bold">NOTE:</label>
            <textarea id="notes" rows="4" class="w-full border rounded p-2 mt-1" placeholder="Siblings, special needs, appointment preferences..."></textarea>
        </div>
        <div class="nav-buttons">
          <button class="w-1/3 md:w-auto px-4 py-2 bg-gray-500 text-white rounded shadow hover:bg-gray-600 transition" onclick="goTo(5)">Back</button>
          <button class="w-full md:w-auto px-6 py-3 bg-green-700 text-white rounded font-bold shadow hover:bg-green-800 transition" onclick="generateFinal()">Generate Yellow Form</button>
        </div>
      </section>
    </div>

    <div id="finalWrap" class="final-wrap hidden mt-6">
      
      <div class="table-responsive bg-gray-200 p-2 rounded border mb-4">
        <div id="finalArea" class="p-6 rounded shadow border min-w-[700px]" style="background-color: #fff989;"></div>
      </div>

      <div class="mt-4 flex flex-col md:flex-row justify-center gap-3 relative">
    
        <div id="orientationSelector" 
             class="absolute hidden bottom-full left-1/2 md:left-auto md:right-1/2 -translate-x-1/2 md:translate-x-1/2 mb-3 p-3 rounded shadow-xl z-20 text-sm" 
             style="background-color: #fff8dc; border: 1px solid #C7631C; width: 220px;">
             
            <p class="font-bold mb-2 text-gray-800 text-center">Select PDF Orientation:</p>
            
            <button id="downloadPortraitBtn" class="w-full mb-1 px-3 py-2 text-white rounded hover:opacity-90 transition" 
                    style="background-color: #C7631C;">
                Portrait (Taller)
            </button>
            
            <button id="downloadLandscapeBtn" class="w-full px-3 py-2 text-white rounded hover:opacity-90 transition" 
                    style="background-color: #C7631C;">
                Landscape (Wider)
            </button>
        </div>
    
        <button id="editBtn" class="w-full md:w-auto px-4 py-3 bg-green-700 text-white rounded shadow">Back to Edit</button>
        <button id="printBtn" class="w-full md:w-auto px-4 py-3 bg-blue-600 text-white rounded shadow" onclick="window.print()">Print</button>
        <button id="pdfBtn" class="w-full md:w-auto px-4 py-3 text-white rounded shadow" style="background-color: #C7631C;">Download PDF</button>
        <button id="newFormBtn" class="w-full md:w-auto px-4 py-3 bg-red-700 text-white rounded shadow">New Form</button>
      </div>
    </div>
  </div>

  <script>
  // ============================================
  // 1. GLOBAL VARIABLES & UTILS
  // ============================================
  let currentStep = 1;
  let studentCount = 0;
  let countries = [];
  let countriesLoaded = false;
  const loadCountriesPromise = loadCountries(); 

  function escapeHtml(str) { 
    if (!str) return ''; 
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function checkboxMark(cond){ return cond ? '☑' : '☐' }
  
  function getRadioValue(name){ 
    const r = document.querySelector(`input[name='${name}']:checked`); 
    return r ? r.value : ''; 
  }

  function goTo(step){
    if (step < 1 || step > 6) return;
    document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
    const target = document.querySelector(`.page[data-step='${step}']`);
    if(target) {
        target.classList.remove('hidden');
        currentStep = step;
        window.scrollTo({top:0, behavior:'smooth'});
    }
  }

  function toggleOtherField(id, el){ 
    const inp = document.getElementById(id); 
    if(el.value === 'Other' && el.checked){ 
        inp.classList.remove('hidden'); 
        inp.focus(); 
    } else { 
        inp.classList.add('hidden'); 
        inp.value = ''; 
    }
  }

  function toggleOtherRelation(select){
    const otherBox = document.getElementById('otherRelation');
    if(select.value === 'Other'){ 
        otherBox.classList.remove('hidden'); 
        otherBox.focus(); 
    } else { 
        otherBox.classList.add('hidden'); 
        otherBox.value = ''; 
    }
  }

  function toggleAttendance(isYes){
    const d = document.getElementById('prevDetails');
    if(isYes){ 
        d.disabled = false; 
        d.classList.remove('disabled-input'); 
        d.focus(); 
    } else { 
        d.disabled = true; 
        d.classList.add('disabled-input'); 
        d.value = ''; 
    }
  }

  function toggleLimitedProfile(isYes) {
    const box = document.getElementById('limitedProfileBox');
    if (isYes) { 
        box.classList.remove('hidden'); 
    } else { 
        box.classList.add('hidden'); 
        document.getElementById('limitedProfileDetails').value = ''; 
    }
  }

  function formatPhone(input) {
    let value = input.value.replace(/\D/g, '');
    if (value.length > 3 && value.length <= 6) {
      input.value = '(' + value.slice(0,3) + ') ' + value.slice(3);
    } else if (value.length > 6) {
      input.value = '(' + value.slice(0,3) + ') ' + value.slice(3,6) + '-' + value.slice(6,10);
    } else {
      input.value = value;
    }
  }

  function enforcePostalFormat(input) {
    let value = input.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    let formatted = '';
    if (value.length > 0) formatted += value[0].replace(/[^A-Z]/g, '');
    if (value.length > 1) formatted += value[1].replace(/[^0-9]/g, '');
    if (value.length > 2) formatted += value[2].replace(/[^A-Z]/g, '');
    if (value.length > 3) formatted += ' ' + value[3].replace(/[^0-9]/g, '');
    if (value.length > 4) formatted += value[4].replace(/[^A-Z]/g, '');
    if (value.length > 5) formatted += value[5].replace(/[^0-9]/g, '');
    input.value = formatted;
  }

  document.addEventListener("input", function (e) {
    if (e.target.type === "date") {
      let v = e.target.value;
      if (v.length >= 5 && v[4] !== "-") {
        let parts = v.split("-");
        if (parts[0].length > 4) { parts[0] = parts[0].substring(0, 4); }
        e.target.value = parts.join("-");
      }
    }
  });

  async function loadCountries(){
    try {
      const res = await fetch("https://restcountries.com/v3.1/all?fields=name");
      const data = await res.json();
      countries = data.map(c => c.name?.common).filter(Boolean).sort((a, b) => a.localeCompare(b));
    } catch(err){
      console.error("API Error, using fallback", err);
      countries = ["Afghanistan","Canada","China","Eritrea","Ethiopia","India","Mexico","Philippines","Syria","Ukraine","United States","Vietnam","Other"];
    } finally {
      countriesLoaded = true;
    }
  }

  function populateCountrySelectById(selectEl, selectedValue){
    const $s = $(selectEl);
    $s.empty();
    $s.append($('<option disabled>').text('Select country').prop('selected', !selectedValue).prop('hidden', true));
    
    countries.forEach(c => {
      $s.append($('<option>').val(c).text(c));
    });

    if($s.data('select2')) { $s.select2('destroy'); }
    
    $s.select2({
      width: '100%',
      placeholder: "Search for a country",
      dropdownParent: $(document.body)
    });

// Keyboard Nav Logic
document.addEventListener('DOMContentLoaded', () => {
    function getFocusableElements(container) {
        if (!container) return [];
        const selector = 'input:not([type="hidden"]):not([disabled]), select:not([disabled]), textarea:not([disabled]), button:not([disabled]), a[href]';
        let elements = Array.from(container.querySelectorAll(selector));
        const select2Triggers = Array.from(container.querySelectorAll('.select2-selection'));
        const tomSelectInputs = Array.from(container.querySelectorAll('.ts-control input'));
        const allCandidates = [...elements, ...select2Triggers, ...tomSelectInputs];

        return allCandidates.filter(el => {
            if (el.closest('.nav-buttons')) return false;
            if (el.offsetParent === null) return false;
            if (el.tagName === 'SELECT' && (el.classList.contains('select2-hidden-accessible') || el.style.display === 'none')) return false;
            if (el.closest('.hidden')) return false;
            return true;
        }).sort((a, b) => {
            return (a.compareDocumentPosition(b) & Node.DOCUMENT_POSITION_FOLLOWING) ? -1 : 1;
        });
    }

    document.addEventListener('keydown', function(event) {
        const currentStep = document.querySelector('.page:not(.hidden)');
        if (!currentStep) return;

        const activeEl = document.activeElement;
        const key = event.key;
        const isShift = event.shiftKey;

        if (isShift && (key === 'ArrowLeft' || key === 'ArrowRight')) {
            event.preventDefault();
            const currentStepNum = parseInt(currentStep.dataset.step, 10);
            let nextStepNum = key === 'ArrowRight' ? currentStepNum + 1 : currentStepNum - 1;
            if (typeof goTo === 'function' && nextStepNum >= 1 && nextStepNum <= 6) {
                goTo(nextStepNum);
                setTimeout(() => {
                    const newPage = document.querySelector(`.page[data-step="${nextStepNum}"]`);
                    const focusables = getFocusableElements(newPage);
                    if (focusables[0]) focusables[0].focus();
                }, 50);
            }
            return;
        }

        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(key)) {
            const isSelect2Open = document.querySelector('.select2-container--open');
            const tsWrapper = activeEl.closest('.ts-wrapper');
            const isTomSelectOpen = tsWrapper && tsWrapper.classList.contains('input-active') && activeEl.closest('.ts-control');

            if (isSelect2Open || isTomSelectOpen) return;

            const isTextLike = activeEl.tagName === 'INPUT' && ['text', 'password', 'email', 'tel', 'number', 'search', 'url'].includes(activeEl.type);
            const isTextArea = activeEl.tagName === 'TEXTAREA';
            
            if (isTextLike || isTextArea) {
                 try {
                    if (key === 'ArrowLeft' && activeEl.selectionStart > 0) return;
                    if (key === 'ArrowRight' && activeEl.selectionStart < activeEl.value.length) return;
                } catch (e) {}
            }
            if (activeEl.tagName === 'INPUT' && activeEl.type === 'date') {
                 if (key === 'ArrowLeft' || key === 'ArrowRight') return; 
            }

            event.preventDefault(); 
            const focusables = getFocusableElements(currentStep);
            if (focusables.length === 0) return;

            const idx = focusables.indexOf(activeEl);
            let nextIdx = idx;

            if (key === 'ArrowRight' || key === 'ArrowDown') {
                nextIdx = (idx + 1) % focusables.length;
            } else {
                nextIdx = (idx - 1 + focusables.length) % focusables.length;
            }

            if (focusables[nextIdx]) focusables[nextIdx].focus();
        }

        if (key === 'Enter') {
            if (activeEl.tagName === "SELECT") return; 
            if (activeEl.tagName === 'TEXTAREA') return;

            event.preventDefault(); 

            if (activeEl.type === 'radio') {
                if (activeEl.checked && activeEl.wasChecked) {
                    activeEl.checked = false;
                    activeEl.wasChecked = false;
                    if (activeEl.value === "Other") {
                        const target = activeEl.getAttribute("onchange")?.match(/'(.*?)'/)?.[1];
                        if (target) {
                            const input = document.getElementById(target);
                            input.classList.add("hidden");
                            input.value = "";
                        }
                    }
                    return;
                }
                document.querySelectorAll(`input[name="${activeEl.name}"]`).forEach(r => (r.wasChecked = false));
                activeEl.wasChecked = true;
                activeEl.checked = true;
                activeEl.dispatchEvent(new Event('change', { bubbles: true }));
                return;
            }

            if (activeEl.classList.contains('select2-selection')) { $(activeEl).trigger('click'); return; }
            if (activeEl.closest('.ts-control')) { activeEl.click(); return; }
            if (activeEl.tagName === 'BUTTON') { activeEl.click(); }
        }
      
        if (key === ' ' && currentStep.dataset.step === '6') {
            const isTextType = activeEl.tagName === 'INPUT' && activeEl.type !== 'radio' && activeEl.type !== 'checkbox';
            if (isTextType || activeEl.tagName === 'TEXTAREA') {
                return; 
            }
            const generateBtn = document.querySelector('.page[data-step="6"] button:last-child');
            if (generateBtn && generateBtn.textContent.includes('Generate Yellow Form')) {
                event.preventDefault();
                generateBtn.click();
            }
        }
    });
});
</script>

</body>
</html>
